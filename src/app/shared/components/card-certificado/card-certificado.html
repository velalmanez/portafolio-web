<div class="card card-primary">
    <div class="card-header d-flex justify-content-center align-items-center">
        <h5 class="card-title">{{ certificado.title }}</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-9">
                <h6 class="card-subtitle mb-2">{{ certificado.institution }}</h6>
                <p class="card-text card-description">{{ certificado.description }}</p>
                <p class="card-text card-date">{{ certificado.date }}</p>
            </div>
            <div class="col-md-3">
                <img src="{{ certificado.imageUrl }}" alt="{{ certificado.title }}" class="img-fluid rounded-square">
            </div>            
        </div>
    </div>
    <div class="card-footer text-center">
        <a href="{{ certificado.link }}" target="_blank" class="btn mt-auto btn-card">Ver constancia</a>
    </div>
</div>
